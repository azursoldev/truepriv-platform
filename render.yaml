services:
  - type: web
    name: truepriv-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_NAME
        value: "TruePriv Platform"
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: SANCTUM_STATEFUL_DOMAINS
        value: "truepriv-saas.vercel.app,localhost:3000"
      - key: DUAL_RESIDENCY_ENABLED
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: truepriv-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: truepriv-postgres
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: truepriv-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: truepriv-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: truepriv-postgres
          property: password

databases:
  - name: truepriv-postgres
    plan: free
    region: oregon
    databaseName: truepriv_db
    user: truepriv_user
