services:
  - type: web
    name: truepriv-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_NAME
        value: "TruePriv Platform"
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: SANCTUM_STATEFUL_DOMAINS
        value: "truepriv-saas.vercel.app,localhost:3000"
      - key: DUAL_RESIDENCY_ENABLED
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
