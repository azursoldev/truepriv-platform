    /* 1. Page Title & Banner */
    .page-title-section { padding: 3rem 0 1.5rem; }
    .breadcrumbs-detail { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: #64748b; margin-bottom: 1.25rem; }

    .page-main-headline { font-family: var(--font-serif); font-size: 3.6rem; font-weight: 700; color: var(--pwc-charcoal); line-height: 1.1; letter-spacing: -0.02em; }

    .hero-banner-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pwc-orange-polygon {
      position: absolute; bottom: 25%; left: 35%; width: 55%; height: 72px; background: var(--pwc-orange);
      clip-path: polygon(8% 0, 100% 0, 92% 100%, 0% 100%); display: flex; align-items: center;
      padding-left: 3.5rem; color: #ffffff; font-weight: 700; font-size: 1.1rem; letter-spacing: 0.5px;

    /* 2. Overview Split */
    .split-intro-section { padding-bottom: 5rem; }
    .split-intro-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 4rem; align-items: center; }
    .split-intro-left h2 { font-family: var(--font-serif); font-size: 2.25rem; font-weight: 700; color: var(--pwc-charcoal); line-height: 1.25; margin-bottom: 1.25rem; }
    .split-intro-left p { font-size: 1.05rem; color: var(--pwc-gray-text); line-height: 1.7; margin-bottom: 1.25rem; }
    .bullet-check-list { list-style: none; margin: 1.5rem 0 2rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .bullet-check-list li { display: flex; align-items: flex-start; gap: 0.75rem; font-size: 0.98rem; color: #1e293b; font-weight: 600; }
    .bullet-check-list li i { color: var(--pwc-orange); margin-top: 0.25rem; }
    .split-intro-right img { width: 100%; height: 380px; object-fit: cover; border-radius: 4px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); }

    /* 3. Tabs */
    .tabs-section { padding: 4.5rem 0; border-top: 1px solid var(--pwc-gray-border); }
    .tabs-section-title { font-family: var(--font-serif); font-size: 2.2rem; font-weight: 700; color: var(--pwc-charcoal); margin-bottom: 2rem; }
    .pwc-nav-tabs { display: flex; gap: 2.5rem; border-bottom: 2px solid #e2e8f0; margin-bottom: 3rem; overflow-x: auto; }
    .pwc-tab-btn {
      background: none; border: none; font-family: inherit; font-size: 1.05rem; font-weight: 600;
      color: #64748b; padding: 0.75rem 0 1rem; cursor: pointer; position: relative; white-space: nowrap; transition: all 0.2s;
    }
    .pwc-tab-btn:hover { color: var(--pwc-orange); }
    .pwc-tab-btn.active { color: var(--pwc-orange); font-weight: 700; }
    .pwc-tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 3px; background: var(--pwc-orange); }
    .pwc-tab-pane { display: none; grid-template-columns: 0.95fr 1.05fr; gap: 4rem; align-items: center; }
    .pwc-tab-pane.active { display: grid; }
    .tab-pane-img { width: 100%; height: 360px; object-fit: cover; border-radius: 4px; }
    .tab-pane-content h3 { font-family: var(--font-serif); font-size: 1.85rem; font-weight: 700; color: var(--pwc-charcoal); margin-bottom: 1rem; line-height: 1.3; }
    .tab-pane-content p { font-size: 1rem; color: var(--pwc-gray-text); line-height: 1.7; margin-bottom: 1.5rem; }

    /* 4. FAQ */
    .faq-section { padding: 5rem 0; border-top: 1px solid var(--pwc-gray-border); }
    .faq-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 4.5rem; align-items: start; }
    .faq-grid h2 { font-family: var(--font-serif); font-size: 2.2rem; font-weight: 700; color: var(--pwc-charcoal); margin-bottom: 2rem; }
    .accordion-list { display: flex; flex-direction: column; border-top: 1px solid #e2e8f0; }
    .accordion-item { border-bottom: 1px solid #e2e8f0; }
    .accordion-header {
      width: 100%; background: none; border: none; padding: 1.25rem 0; text-align: left;
      font-size: 1.05rem; font-weight: 700; color: var(--pwc-charcoal); cursor: pointer; display: flex;
      justify-content: space-between; align-items: center; gap: 1rem; font-family: inherit; transition: color 0.2s;
    }
    .accordion-header:hover { color: var(--pwc-orange); }
    .accordion-icon { font-size: 1.1rem; color: var(--pwc-orange); transition: transform 0.25s ease; }
    .accordion-item.open .accordion-icon { transform: rotate(45deg); }
    .accordion-body { max-height: 0; overflow: hidden; transition: max-height 0.3s cubic-bezier(0, 1, 0, 1); color: var(--pwc-gray-text); font-size: 0.95rem; line-height: 1.7; }
    .accordion-item.open .accordion-body { max-height: 400px; padding-bottom: 1.25rem; }
    .faq-tall-img { width: 100%; height: 520px; object-fit: cover; border-radius: 4px; box-shadow: 0 10px 24px rgba(0,0,0,0.06); }

    /* 5. Focus Split */
    .focus-split-section { padding: 5rem 0; border-top: 1px solid var(--pwc-gray-border); }
    .focus-split-grid { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 4rem; align-items: center; }
    .focus-split-grid img { width: 100%; height: 380px; object-fit: cover; border-radius: 4px; }
    .focus-split-grid h3 { font-family: var(--font-serif); font-size: 2rem; font-weight: 700; color: var(--pwc-charcoal); margin-bottom: 1rem; line-height: 1.3; }
    .focus-split-grid p { font-size: 1.02rem; color: var(--pwc-gray-text); line-height: 1.7; margin-bottom: 1.25rem; }

    /* 6. Twin Cards */
    .twin-cards-section { padding: 2rem 0 5rem; }
    .twin-cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem; }
    .twin-peach-card { background: var(--pwc-peach-light); border-top: 4px solid var(--pwc-orange); padding: 3rem 2.5rem; border-radius: 2px; display: flex; flex-direction: column; justify-content: space-between; }
    .twin-peach-card h3 { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 700; color: var(--pwc-charcoal); margin-bottom: 1rem; line-height: 1.3; }
    .twin-peach-card p { font-size: 0.95rem; color: var(--pwc-gray-text); line-height: 1.65; margin-bottom: 2rem; }

    /* 7. Process */
    .process-section { padding: 5rem 0; border-top: 1px solid var(--pwc-gray-border); }
    .process-section h2 { font-family: var(--font-serif); font-size: 2.2rem; font-weight: 700; color: var(--pwc-charcoal); margin-bottom: 3rem; }
    .process-steps-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; margin-bottom: 3.5rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 1.5rem; }
    .step-nav-item { text-align: center; cursor: pointer; position: relative; }
    .step-icon-wrap {
      width: 64px; height: 64px; margin: 0 auto 0.75rem; border: 2px solid var(--pwc-orange);
      border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--pwc-orange);
      font-size: 1.35rem; background: #ffffff; transition: all 0.2s;
    }
    .step-nav-item:hover .step-icon-wrap, .step-nav-item.active .step-icon-wrap { background: var(--pwc-orange); color: #ffffff; }
    .step-nav-title { font-size: 0.88rem; font-weight: 700; color: var(--pwc-charcoal); }
    .process-feature-split { display: grid; grid-template-columns: 0.95fr 1.05fr; gap: 4rem; align-items: center; background: #f8fafc; padding: 2.5rem; border-radius: 4px; border: 1px solid #e2e8f0; }
    .process-feature-split img { width: 100%; height: 320px; object-fit: cover; border-radius: 4px; }
    .process-feature-split h3 { font-family: var(--font-serif); font-size: 1.8rem; font-weight: 700; color: var(--pwc-charcoal); margin-bottom: 1rem; }
    .process-feature-split p { font-size: 0.98rem; color: var(--pwc-gray-text); line-height: 1.7; margin-bottom: 1.5rem; }

    /* 8. Pillars */
    .pillars-section { padding: 5.5rem 0; border-top: 1px solid var(--pwc-gray-border); }
    .pillars-section h2 { font-family: var(--font-serif); font-size: 2.3rem; font-weight: 700; color: var(--pwc-charcoal); margin-bottom: 1rem; max-width: 800px; }
    .pillars-section p.sub-lead { font-size: 1.05rem; color: var(--pwc-gray-text); margin-bottom: 4rem; max-width: 760px; }
    .staggered-columns-wrap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; align-items: end; }
    .stagger-col { padding: 2.5rem 2rem; border-radius: 4px 4px 0 0; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
    .stagger-col:hover { transform: translateY(-6px); }
    .stagger-1 { height: 420px; background: var(--pwc-peach-light); border-top: 4px solid #f97316; }
    .stagger-2 { height: 480px; background: var(--pwc-peach-med); border-top: 4px solid var(--pwc-orange); }
    .stagger-3 { height: 540px; background: var(--pwc-orange); color: #ffffff; border-top: 4px solid var(--pwc-black); }
    .stagger-badge { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 800; margin-bottom: 1rem; display: inline-block; letter-spacing: 1px; }
    .stagger-1 .stagger-badge, .stagger-2 .stagger-badge { color: var(--pwc-orange); }
    .stagger-3 .stagger-badge { color: #ffe4d6; }
    .stagger-col h3 { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 700; margin-bottom: 1rem; line-height: 1.25; }
    .stagger-3 h3 { color: #ffffff; }
    .stagger-col p { font-size: 0.92rem; line-height: 1.65; margin-bottom: 1.5rem; }
    .stagger-1 p, .stagger-2 p { color: #475569; }
    .stagger-3 p { color: #ffede3; }
    .stagger-points { list-style: none; display: flex; flex-direction: column; gap: 0.65rem; font-size: 0.86rem; font-weight: 600; margin-top: auto; }
    .stagger-points li { display: flex; align-items: center; gap: 0.5rem; }
    .stagger-1 .stagger-points i, .stagger-2 .stagger-points i { color: var(--pwc-orange); }
    .stagger-3 .stagger-points i { color: #ffffff; }

    /* 9. Hex */
    .hex-section { padding: 5rem 0; background: #fbfcfd; border-top: 1px solid var(--pwc-gray-border); }
    .hex-section h2 { font-family: var(--font-serif); font-size: 2.2rem; font-weight: 700; text-align: center; color: var(--pwc-charcoal); margin-bottom: 3.5rem; }
    .hex-cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.5rem; }
    .hex-card { background: #ffffff; border: 1px solid var(--pwc-gray-border); border-radius: 4px; padding: 2.5rem 2rem; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: space-between; transition: all 0.2s; }
    .hex-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,0.06); border-color: #cbd5e1; }
    .pwc-hex-icon {
      width: 80px; height: 80px; background: var(--pwc-peach-light); border: 3px solid var(--pwc-orange);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex; align-items: center; justify-content: center; color: var(--pwc-orange); font-size: 1.8rem; margin-bottom: 1.75rem;
    }
    .hex-card h3 { font-family: var(--font-serif); font-size: 1.35rem; font-weight: 700; color: var(--pwc-charcoal); margin-bottom: 0.75rem; }
    .hex-card p { font-size: 0.92rem; color: var(--pwc-gray-text); line-height: 1.6; margin-bottom: 1.75rem; }

    /* 10. Callout */
    .callout-bar-section { background: var(--pwc-peach-light); border-top: 1px solid var(--pwc-peach-med); border-bottom: 1px solid var(--pwc-peach-med); padding: 3rem 0; text-align: center; }
    .callout-bar-inner { display: flex; align-items: center; justify-content: space-between; gap: 2rem; flex-wrap: wrap; }
    .callout-bar-inner h3 { font-family: var(--font-serif); font-size: 1.65rem; font-weight: 700; color: var(--pwc-charcoal); text-align: left; }

    /* 11. Case Study */
    .case-study-section { padding: 5rem 0; border-top: 1px solid var(--pwc-gray-border); }
    .case-study-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 4.5rem; align-items: center; }
    .case-study-left h2 { font-family: var(--font-serif); font-size: 2.2rem; font-weight: 700; color: var(--pwc-charcoal); margin-bottom: 1rem; line-height: 1.25; }
    .case-study-left p { font-size: 1.02rem; color: var(--pwc-gray-text); line-height: 1.7; margin-bottom: 1.5rem; }
    .case-study-right img { width: 100%; height: 380px; object-fit: cover; border-radius: 4px; box-shadow: 0 10px 24px rgba(0,0,0,0.06); }

    /* 12. Accreditation */
    .accreditation-section { padding: 3.5rem 0; background: #ffffff; border-top: 1px solid var(--pwc-gray-border); }
    .accreditation-wrap { display: flex; align-items: center; gap: 3rem; padding: 2rem 2.5rem; border: 1px solid #e2e8f0; border-radius: 4px; background: #f8fafc; }
    .accreditation-seal {
      width: 110px; height: 110px; border: 3px solid #0284c7; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #0284c7; font-family: var(--font-mono); font-weight: 800; text-align: center; flex-shrink: 0; line-height: 1.1; padding: 0.5rem;
    }
    .accreditation-seal span.small { font-size: 0.65rem; }
    .accreditation-seal span.big { font-size: 1.1rem; color: #0369a1; }
    .accreditation-text p { font-size: 0.95rem; color: #334155; line-height: 1.65; }

    /* 13. Insights */
    .related-insights-section { padding: 5rem 0; border-top: 1px solid var(--pwc-gray-border); }
    .related-insights-section h2 { font-family: var(--font-serif); font-size: 2.2rem; font-weight: 700; color: var(--pwc-charcoal); margin-bottom: 2.5rem; }
    .insights-4col-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }
    .insight-mini-card { border: 1px solid var(--pwc-gray-border); border-radius: 2px; overflow: hidden; display: flex; flex-direction: column; background: #ffffff; transition: transform 0.2s; }
    .insight-mini-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.06); }
    .insight-mini-card img { width: 100%; height: 160px; object-fit: cover; }
    .insight-mini-body { padding: 1.25rem 1rem; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .insight-mini-tag { font-family: var(--font-mono); font-size: 0.7rem; color: var(--pwc-orange); font-weight: 700; margin-bottom: 0.4rem; display: block; }
    .insight-mini-body h4 { font-family: var(--font-serif); font-size: 1.05rem; font-weight: 700; color: var(--pwc-charcoal); line-height: 1.35; margin-bottom: 1rem; }
    .insight-mini-link { font-size: 0.8rem; font-weight: 700; color: var(--pwc-orange); display: inline-flex; align-items: center; gap: 0.35rem; margin-top: auto; }

    /* 14. Contacts */
    .key-contacts-section { padding: 5rem 0; border-top: 1px solid var(--pwc-gray-border); }
    .key-contacts-section h2 { font-family: var(--font-serif); font-size: 2.2rem; font-weight: 700; color: var(--pwc-charcoal); margin-bottom: 2.5rem; }
    .contacts-2col-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem; }
    .expert-card { display: flex; gap: 1.75rem; padding: 2rem; border: 1px solid var(--pwc-gray-border); border-radius: 4px; background: #fdfdfd; align-items: center; }
    .expert-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--pwc-charcoal); color: var(--pwc-orange); font-family: var(--font-serif); font-size: 1.75rem; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid var(--pwc-orange); flex-shrink: 0; }
    .expert-info h3 { font-family: var(--font-serif); font-size: 1.25rem; font-weight: 700; color: var(--pwc-charcoal); }
    .expert-role { font-size: 0.84rem; font-weight: 700; color: var(--pwc-orange); margin: 0.2rem 0 0.6rem; }
    .expert-link { font-size: 0.85rem; font-weight: 700; color: var(--pwc-charcoal); display: inline-flex; align-items: center; gap: 0.4rem; transition: color 0.2s; }
    .expert-link:hover { color: var(--pwc-orange); }

    /* 15. Closing Banner */
    .closing-hero-wrap { position: relative; background: #0f172a; padding: 6rem 0; overflow: hidden; }
    .closing-hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.25; }
    .closing-hero-content { position: relative; z-index: 2; max-width: 800px; }
    .closing-kicker { font-size: 0.85rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; display: block; }
    .closing-title { font-family: var(--font-serif); font-size: 3.2rem; font-weight: 700; color: #ffffff; line-height: 1.15; margin-bottom: 2rem; }
    .closing-title span.orange { color: var(--pwc-orange); }

    /* 16. Footer */
    .pwc-footer { background: var(--pwc-charcoal); color: #ffffff; padding: 4.5rem 0 2.5rem; border-top: 1px solid #3d3d3d; font-size: 0.88rem; }
    .pwc-footer-container { max-width: 1280px; margin: 0 auto; padding: 0 3.5rem; }
    .pwc-footer-columns { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr 1fr; gap: 2.5rem; padding-bottom: 3.5rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    .footer-col h5 { font-family: var(--font-serif); font-size: 1.15rem; font-weight: 700; margin-bottom: 1.25rem; color: #ffffff; }
    .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 0.6rem; }
    .footer-col a { color: #94a3b8; transition: color 0.2s; font-size: 0.85rem; }
    .footer-col a:hover { color: var(--pwc-orange); }
    .pwc-footer-bottom { display: flex; justify-content: space-between; align-items: center; color: #94a3b8; font-size: 0.8rem; flex-wrap: wrap; gap: 1.5rem; padding-top: 2rem; }
    .pwc-footer-bottom a { color: #94a3b8; text-decoration: none; }
    .pwc-footer-bottom a:hover { color: var(--pwc-orange); }

    @media (max-width: 1024px) {
      .top-bar { padding: 0.35rem 1.5rem; }
      .header { padding: 0.75rem 1.5rem; }
      .main-nav { display: none; }

      .split-intro-grid, .pwc-tab-pane, .faq-grid, .focus-split-grid, .process-feature-split, .case-study-grid { grid-template-columns: 1fr; gap: 2.5rem; }

      .hex-cards-grid { grid-template-columns: 1fr; }
      .twin-cards-grid { grid-template-columns: 1fr; }

      .contacts-2col-grid { grid-template-columns: 1fr; }

  <!-- Unified Site Header (Single Source: js/header.js & css/header.css) -->

  <script>
    function openSearchModal() {
      const modal = document.getElementById('siteSearchModal');
      if (modal) {
        modal.classList.add('open');
        setTimeout(() => {
          const inp = document.getElementById('siteSearchInput');
          if (inp) inp.focus();
        }, 100);
      }
    }

    function closeSearchModal() {
      const modal = document.getElementById('siteSearchModal');
      if (modal) modal.classList.remove('open');
    }

    function handleSearch(val) {
      const res = document.getElementById('searchResults');
      if (!res) return;
      if (!val || val.trim() === '') {
        res.innerHTML = '<div class="search-quick-links"><span>Quick links:</span><a href="service-car.html">Compliance Audit Return (CAR)</a><a href="service-dpo.html">Outsourced DPO</a><a href="service-audit.html">Data Protection Audit</a><a href="service-training.html">Data Protection Training</a><a href="topics.html#ndpa-laws">NDPA 2023 Statutory Laws</a></div>';
        return;
      }
      const q = val.toLowerCase();
      const allServices = [
        { name: 'Compliance Audit Return (CAR)', url: 'service-car.html', desc: 'Statutory annual audit filing with NDPC before March 15.' },
        { name: 'Data Protection Audit', url: 'service-audit.html', desc: 'Comprehensive technical and operational gap assessments.' },
        { name: 'Data Protection Training', url: 'service-training.html', desc: 'Workforce NDPA e-learning & DPO masterclasses.' },
        { name: 'Privacy Policies & Notices', url: 'service-policies.html', desc: 'Layered transparency notices and vendor DPAs.' },
        { name: 'ROPA (Record of Processing Activities)', url: 'service-ropa.html', desc: 'Article 24 data lineage and processing inventory.' },
        { name: 'DPIA & LIA Assessments', url: 'service-dpia.html', desc: 'High-risk 5x5 threat and impact assessments.' },
        { name: 'Outsourced DPO', url: 'service-dpo.html', desc: 'Accredited external DPO designation & NDPC liaison.' },
        { name: 'Cybersecurity & Pen-Testing', url: 'service-cyber.html', desc: 'Security posture hardening, vulnerability assessment & pen-testing.' },
        { name: 'Corporate Governance', url: 'service-gov.html', desc: 'Boardroom digital trust charters and fiduciary risk monitoring.' },
        { name: 'Cookie & Consent Compliance', url: 'index.html#service-cookie', desc: 'Zero-party consent telemetry and tracking audits.' }
      ];
      const filtered = allServices.filter(s => s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q));
      if (filtered.length === 0) {
        res.innerHTML = '<p style="color: #64748b; font-size: 0.9rem;">No direct matching service found. <a href="contact.html" style="color: var(--pwc-orange);">Contact our advisory desk</a> for assistance.</p>';
      } else {
        res.innerHTML = filtered.map(s => '<div style="padding: 0.65rem 0; border-bottom: 1px solid #f1f5f9;"><a href="' + s.url + '" style="font-weight: 700; color: #0f172a; text-decoration: none; display: block; font-size: 0.95rem;">' + s.name + '</a><span style="font-size: 0.8rem; color: #64748b;">' + s.desc + '</span></div>').join('');
      }
    }
  </script>
